<style>
:root{
  color-scheme:light;
  --surface:oklch(97.5% .004 160); --panel:#fff; --ink:oklch(22% .01 160); --ink-2:oklch(43% .012 160); --ink-3:oklch(58% .01 160);
  --rule:oklch(88% .008 160); --rule-2:oklch(93% .006 160); --hover:oklch(95% .008 160); --shadow:rgba(12,28,20,.14); --scrim:rgba(255,255,255,.88);
  --accent:oklch(64% .105 216); --accent-strong:oklch(52% .09 216); --accent-soft:oklch(64% .105 216/.10); --signal-green:oklch(59.1% .183 143);
  --s1:oklch(59% .14 245); --s2:oklch(61% .19 38); --s3:oklch(60.4% .14 155); --s4:oklch(65% .13 78); --s5:oklch(62% .17 350); --s6:oklch(59.1% .183 143); --s7:oklch(57% .18 292); --s8:oklch(60% .20 25); --s9:oklch(58% .015 150);
}
*{box-sizing:border-box}
html,body{height:100%;touch-action:pan-x pan-y;overscroll-behavior-x:none}
body{background:var(--surface);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;margin:0;padding:0;overflow:hidden}
.wrap{height:100vh;height:100dvh;padding:14px 16px 0;display:flex;flex-direction:column;overflow:hidden;--reader-w:clamp(360px,40vw,680px)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 40px;margin:0 0 16px}
h1{font:500 34px/1.05 Newsreader,Georgia,serif;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.brief{font:400 17px/1.4 Newsreader,Georgia,serif;color:var(--ink-2);max-width:70ch;margin:0}
.brief b{color:var(--ink);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:0 26px;padding:0}
.stat{display:flex;align-items:baseline;gap:7px}
.stat .n{font:500 19px/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;margin:0 0 7px}
body.reader-open .controls{flex-wrap:nowrap;overflow-x:auto;margin-right:calc(var(--reader-w) + 2px);scrollbar-width:thin}
body.reader-open .controls .legend{flex-wrap:nowrap}
body.reader-open .controls .chip{flex:none}
body.reader-open .tag-panel{margin-right:calc(var(--reader-w) + 2px)}
.tag-panel{position:relative;margin:0 0 5px}
.filter-head{display:flex;align-items:center;gap:14px;min-height:30px}
.time-control,.view-control{display:flex;flex-direction:row;align-items:center;gap:7px;flex:none}
.filter-head .seglbl{font-size:11px;line-height:1;font-weight:500;color:var(--ink-2);letter-spacing:.025em;margin:0}
.filter-head .seg button{font-size:12px}
.tag-toggle{appearance:none;border:0;background:transparent;color:var(--ink-2);padding:3px 0;font:500 12px/1.4 "IBM Plex Sans",sans-serif;letter-spacing:.025em;text-transform:uppercase;cursor:pointer}
.tag-toggle:hover{color:var(--ink);background:transparent}
.tag-toggle .caret{display:inline-block;width:14px;color:var(--ink-3)}
.tag-toggle .k{font-family:"IBM Plex Mono",monospace;color:var(--ink-3);margin-left:4px}
.tag-list{display:flex;flex-wrap:nowrap;gap:6px 8px;overflow-x:auto;overflow-y:hidden;padding:8px 2px 7px;scrollbar-width:none;overscroll-behavior-x:contain}
.tag-list::-webkit-scrollbar{display:none}
.tag-list[hidden]{display:none}
.tagchip{padding-left:10px;flex:none}
.tag-panel::before,.tag-panel::after{content:"";position:absolute;z-index:2;top:38px;bottom:4px;width:28px;pointer-events:none;opacity:0;transition:opacity .16s ease}
.tag-panel::before{left:0;background:linear-gradient(90deg,var(--surface),transparent)}
.tag-panel::after{right:0;background:linear-gradient(270deg,var(--surface),transparent)}
.tag-panel.can-scroll-left::before,.tag-panel.can-scroll-right::after{opacity:1}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:5px;overflow:hidden;background:transparent}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 13px/1 "IBM Plex Sans",sans-serif;padding:8px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:hover:not([aria-pressed="true"]){background:var(--hover)}
.time-control .seg,.view-control .seg{height:29px;border:1px solid var(--rule);border-radius:5px;background:transparent;overflow:hidden}
.time-control .seg button,.view-control .seg button{padding:0 9px;border:0;border-radius:0;background:transparent;color:var(--ink-3)}
.time-control .seg button+button,.view-control .seg button+button{border-left:1px solid var(--rule)}
.time-control .seg button[aria-pressed="true"],.view-control .seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);font-weight:500;box-shadow:inset 0 -2px var(--accent)}
.time-control .seg button:hover:not([aria-pressed="true"]),.view-control .seg button:hover:not([aria-pressed="true"]){background:var(--hover);color:var(--ink-2)}
button:focus-visible,.zui:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.seglbl{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;margin-right:8px}
.iconb{appearance:none;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);height:30px;min-width:30px;padding:0 8px;border-radius:4px;font:500 14px/1 "IBM Plex Mono",monospace;cursor:pointer}
.iconb:hover{background:var(--hover)}
.legend{display:flex;flex-wrap:wrap;gap:6px 8px}
.chip{--c:var(--accent);appearance:none;border:1px solid var(--rule);background:transparent;color:var(--ink-2);border-radius:7px;padding:5px 10px 5px 8px;font:400 12.5px/1 "IBM Plex Sans",sans-serif;display:inline-flex;align-items:center;gap:7px;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease}
.chip.tagchip{--c:var(--signal-green)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.chip .k{font:500 11.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3)}
.chip[aria-pressed="true"]{background:color-mix(in oklab,var(--c) 12%,var(--surface));color:var(--ink);border-color:color-mix(in oklab,var(--c) 72%,var(--rule));box-shadow:inset 0 -2px var(--c)}
.chip[aria-pressed="true"] .k{color:var(--ink-2);opacity:1}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]:hover{background:color-mix(in oklab,var(--c) 17%,var(--surface))}
.hint{font-size:12.5px;color:var(--ink-3)}

/* ---------- ZUI ---------- */
.workspace{position:relative;display:flex;flex:1;min-width:0;min-height:0}
.zui{position:relative;flex:1;min-width:0;height:100%;min-height:0;border:1px solid var(--rule);border-radius:8px 8px 0 0;overflow:hidden;background:var(--panel);user-select:none;-webkit-user-select:none;--A:40px}
.corner{position:absolute;left:0;top:0;height:var(--A);min-width:48px;display:flex;align-items:flex-start;padding:5px 10px 0 8px;background:linear-gradient(90deg,var(--panel) 78%,transparent);font:600 11px/1 "IBM Plex Mono",monospace;color:var(--ink-2);z-index:4;pointer-events:none}
.axis{position:absolute;left:0;top:0;right:0;height:var(--A);overflow:hidden;border-bottom:1px solid var(--rule);z-index:3;background:var(--panel)}
.axis .tk{position:absolute;top:0;height:100%;border-left:1px solid var(--rule)}
.axis .tk span{position:absolute;left:5px;top:5px;font:500 11px/1 "IBM Plex Mono",monospace;color:var(--ink-2);white-space:nowrap}
.axis .tk.minor{border-left-color:var(--rule-2)}
.axis .tk.left span{left:auto;right:5px}
.axis .tk.minor span{color:var(--ink-3);font-weight:400}
.axis .yr{position:absolute;bottom:4px;font:500 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap;padding-left:4px;border-left:2px solid var(--ink-3);height:12px;line-height:12px}
.labels{position:absolute;left:0;top:var(--A);right:0;bottom:0;overflow:hidden;z-index:2;pointer-events:none}
.pill{position:absolute;left:0;top:0;display:inline-flex;align-items:center;gap:7px;height:22px;padding:0 6px 0 2px;font:500 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.035em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;pointer-events:none}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.pill .ct{font:400 10px/1 "IBM Plex Mono",monospace;color:var(--ink-3);letter-spacing:0}
.wl{z-index:1}
.labels .lb{background:var(--scrim);backdrop-filter:blur(4px);border-radius:4px;padding:0 8px 0 6px}
.viewport{position:absolute;left:0;top:var(--A);right:0;bottom:0;overflow:hidden;touch-action:none;overscroll-behavior:none;cursor:grab}
.viewport.dragging{cursor:grabbing}
.pan-edge{position:absolute;z-index:8;pointer-events:none;opacity:0;transition:opacity .18s ease}
.pan-edge.left,.pan-edge.right{top:0;bottom:0;width:22px}
.pan-edge.top{left:0;right:var(--pan-right-inset,0px);height:22px}
.pan-edge.bottom{left:0;right:var(--pan-right-inset,0px);height:28px}
.pan-edge.left{left:0;background:linear-gradient(90deg,color-mix(in oklab,var(--accent-strong) 14%,transparent),transparent)}
.pan-edge.right{right:var(--pan-right-inset,0px);background:linear-gradient(270deg,color-mix(in oklab,var(--accent-strong) 14%,transparent),transparent)}
.pan-edge.top{top:0;background:linear-gradient(180deg,color-mix(in oklab,var(--accent-strong) 10%,transparent),transparent)}
.pan-edge.bottom{bottom:0;background:linear-gradient(0deg,color-mix(in oklab,var(--accent-strong) 18%,transparent) 0,color-mix(in oklab,var(--accent-strong) 6%,transparent) 42%,transparent 100%)}
.zui.can-pan-left .pan-edge.left,.zui.can-pan-right .pan-edge.right,.zui.can-pan-up .pan-edge.top,.zui.can-pan-down .pan-edge.bottom{opacity:1}
.vlines{position:absolute;inset:0;pointer-events:none}
.vlines div{position:absolute;top:0;bottom:0;border-left:1px dotted var(--rule)}
.vlines div.major{border-left:1px dashed color-mix(in oklab,var(--ink-3) 50%,transparent)}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.world.settling{transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.bounds{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.bounds path{fill-opacity:.047;stroke:none}
.tile{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:3px;overflow:hidden;cursor:pointer;color:var(--ink);font-family:"IBM Plex Sans",sans-serif;line-height:1.25;
  background:color-mix(in oklab,var(--c) 11%,var(--panel));border-left:3px solid var(--c);padding:0 6px;display:flex;align-items:center;gap:4px;transition:opacity .25s,background .16s ease,box-shadow .16s ease,outline-color .16s ease}
.tile.settling{transition:transform .3s cubic-bezier(.22,.61,.36,1),width .3s cubic-bezier(.22,.61,.36,1),height .3s cubic-bezier(.22,.61,.36,1),opacity .24s}
.tile.enter{opacity:0}
.tile.dim{opacity:.10}
.tile.hit:not(.open){outline:1px solid color-mix(in oklab,var(--c) 75%,var(--ink-3));outline-offset:1px;background:color-mix(in oklab,var(--c) 16%,var(--panel));box-shadow:0 2px 7px var(--shadow);z-index:3}
.tile.open{outline:2px solid var(--accent-strong);outline-offset:2px;box-shadow:0 0 0 1px var(--c);z-index:4}
.tile.l0{background:var(--c);border:0;padding:0;border-radius:1.5px;cursor:zoom-in}
.tile.l0.hit{background:var(--c);outline:2px solid color-mix(in oklab,var(--accent) 72%,white);outline-offset:2px;box-shadow:0 0 0 1px color-mix(in oklab,var(--c) 65%,var(--ink));z-index:3}
.tile .n{font:500 10px/1 "IBM Plex Mono",monospace;color:var(--ink-2);flex:none;letter-spacing:.01em}
.tile sup{font:500 9px/1 "IBM Plex Mono",monospace;color:var(--ink-3);vertical-align:top;position:relative;top:1px;margin-left:4px;letter-spacing:.02em}
.tile.l1{padding:5px 7px 5px 6px;align-items:flex-start}
.tile .t1{width:100%;min-width:0;font:400 13px/1.25 Newsreader,Georgia,serif;overflow-wrap:anywhere}
.tile.l2,.tile.l3{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:7px 9px 7px 8px;gap:4px}
.tile .t2{font:400 14px/1.25 Newsreader,Georgia,serif}
.tile.l3 .t2{font-size:15.5px}
.tile .x{font-size:11.5px;line-height:1.35;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile .ft{font:400 10.5px/1 "IBM Plex Mono",monospace;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.tile.l1:hover{z-index:2}
.mini{position:absolute;right:14px;bottom:14px;width:240px;height:76px;border:1px solid color-mix(in oklab,var(--rule) 75%,var(--accent));border-radius:5px;background:var(--scrim);backdrop-filter:blur(6px);z-index:5;overflow:hidden;cursor:crosshair}
.mini canvas{position:absolute;inset:0;width:100%;height:100%}
.mini .mr{position:absolute;border:1.5px solid var(--accent-strong);border-radius:2px;background:var(--accent-soft);pointer-events:none}
.status{display:none}
.status b{color:var(--ink);font-weight:500}
.status .kb{color:var(--ink-3);font-weight:400;margin-top:4px}
#tip{position:fixed;pointer-events:none;z-index:9;background:var(--ink);color:var(--surface);border:1px solid color-mix(in oklab,var(--accent) 55%,var(--ink));border-radius:5px;padding:8px 11px;max-width:320px;font-size:13px;line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.18)}
#tip .m{font:500 12px/1 "IBM Plex Mono",monospace;opacity:.75;margin-bottom:5px}
#tip .t{font:400 15px/1.3 Newsreader,Georgia,serif}
#tip .g{opacity:.7;font-size:12px;margin-top:5px}
.reader{display:none;position:fixed;z-index:12;right:0;top:0;width:var(--reader-w);height:100vh;height:100dvh;min-height:0;border-left:1px solid color-mix(in oklab,var(--rule) 82%,var(--accent));overflow:visible;background:var(--surface)}
.reader.open{display:block}
.workspace.reader-open .mini{right:calc(var(--reader-w) + 14px)}
#reader-close{position:absolute;z-index:4;left:0;top:48px;transform:translateX(-50%);width:32px;height:32px;min-width:32px;padding:0;border-color:color-mix(in oklab,var(--rule) 70%,transparent);border-radius:50%;background:color-mix(in oklab,var(--panel) 68%,transparent);-webkit-backdrop-filter:blur(10px) saturate(1.12);backdrop-filter:blur(10px) saturate(1.12);box-shadow:0 2px 9px rgba(12,28,20,.10);font-size:17px}
#reader-close:hover{background:color-mix(in oklab,var(--panel) 82%,transparent);border-color:color-mix(in oklab,var(--accent) 55%,var(--rule));color:var(--ink)}
.reader-body{position:absolute;inset:0;min-height:0;overflow:hidden;background:color-mix(in oklab,var(--surface) 96%,var(--ink))}
.reader-body::after{content:"";position:absolute;z-index:3;left:0;top:0;width:38%;height:2px;background:var(--accent);opacity:0;transform:translateX(-110%);pointer-events:none}
.reader.loading .reader-body::after{opacity:1;background:var(--signal-green);animation:reader-progress 1.05s cubic-bezier(.45,0,.25,1) infinite}
.reader iframe{display:block;width:100%;height:100%;border:0;background:color-mix(in oklab,var(--surface) 96%,var(--ink))}
.reader-loading{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:9px;background:color-mix(in oklab,var(--surface) 68%,transparent);backdrop-filter:blur(1.5px);color:var(--ink-2);font:500 12px/1 "IBM Plex Sans",sans-serif;opacity:0;visibility:hidden;transition:opacity .16s ease,visibility 0s linear .16s;pointer-events:none}
.reader.loading .reader-loading{opacity:1;visibility:visible;transition-delay:0s}
.reader-loading::before{content:"";width:15px;height:15px;border:2px solid color-mix(in oklab,var(--signal-green) 28%,transparent);border-top-color:var(--signal-green);border-radius:50%;animation:reader-spin .7s linear infinite}
@keyframes reader-spin{to{transform:rotate(360deg)}}
@keyframes reader-progress{0%{transform:translateX(-110%)}55%{transform:translateX(150%)}100%{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.world.settling,.tile.settling,.tile{transition:none}.reader.loading .reader-body::after{animation:none;transform:none;width:100%}}
@media (max-width:760px){.mini{display:none}.status{max-width:80vw}.reader{inset:0 0 0 auto;width:100vw;z-index:20;box-shadow:none}#reader-close{left:auto;right:10px;top:8px;transform:none}body.reader-open .controls,body.reader-open .tag-panel{margin-right:0}}
</style>

function endPtr(ev){ if(!ptrs.has(ev.pointerId)) return; ptrs.delete(ev.pointerId); vp.classList.remove('dragging');
  if(ptrs.size===1){ const [x,y]=[...ptrs.values()][0]; drag={x,y,t:performance.now()}; pinchD=0; snapAfterPinch(); return; }
  if(ptrs.size===0){ if(Math.abs(Z.k-1)>1e-6){ scheduleSnap(); } else if(moved&&!reduced){ const step=()=>{ vx*=0.92; vy*=0.92; if(Math.abs(vx)<0.3&&Math.abs(vy)<0.3) return; Z.tx+=vx; Z.ty+=vy; clampPan(); applyCamera(); sync(); inertia=requestAnimationFrame(step); }; inertia=requestAnimationFrame(step); } drag=null; } }
function snapAfterPinch(){ if(Math.abs(Z.k-1)>1e-6) scheduleSnap(); }
vp.addEventListener('pointerup',endPtr); vp.addEventListener('pointercancel',endPtr);
vp.addEventListener('click',ev=>{ if(moved){ moved=false; return; } const el=tileAt(ev.clientX,ev.clientY); if(el){ const [x,y]=rel(ev); activateTile(el,x,y); } });
function openReader(p){
  // Opening the fixed reader changes the usable hover area before another
  // pointermove necessarily occurs. Remove the transient hover card instead of
  // leaving it stranded beneath the panel edge.
  tip.hidden=true; Z.hover=null; document.querySelectorAll('.tile.hit').forEach(n=>n.classList.remove('hit'));
  const url=BASE+p.slug+'/';
  openPostIndex=p.i;
  for(const i in Z.el) Z.el[i].classList.toggle('open',+i===openPostIndex);
  if(readerFrame.src!==url){ clearTimeout(readerLoadTimer); readerLoadStarted=performance.now(); reader.classList.add('loading'); readerFrame.src=url; }
  reader.classList.add('open');
  reader.parentElement.classList.add('reader-open');
  document.body.classList.add('reader-open');
  reader.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>{ clampPan(); applyCamera(); sync(); revealPost(p); updateTagOverflow(); });
}
function revealPost(p){
  const el=Z.el[p.i]; if(!el||innerWidth<=760) return;
  const tile=el.getBoundingClientRect(), panel=reader.getBoundingClientRect(), safeRight=panel.left-18;
  if(tile.right<=safeRight) return;
  const start=Z.tx, cw=Z.canvasW*Z.k, usableW=Z.vw-readerInset();
  const target=clamp(start-(tile.right-safeRight),Math.min(0,usableW-cw),Math.max(0,usableW-cw));
  if(Math.abs(target-start)<1) return;
  cancelAnimationFrame(revealAnim); cancelAnimationFrame(inertia);
  const began=performance.now(), duration=reduced?0:300;
  const step=now=>{ const t=duration?Math.min(1,(now-began)/duration):1, eased=1-Math.pow(1-t,3); Z.tx=start+(target-start)*eased; clampPan(); applyCamera(); sync(); if(t<1) revealAnim=requestAnimationFrame(step); };
  revealAnim=requestAnimationFrame(step);
}
readerFrame.addEventListener('load',()=>{ const wait=Math.max(0,260-(performance.now()-readerLoadStarted)); clearTimeout(readerLoadTimer); readerLoadTimer=setTimeout(()=>reader.classList.remove('loading'),wait); });
function closeReader(){
  openPostIndex=null;
  for(const i in Z.el) Z.el[i].classList.remove('open');
  reader.classList.remove('open');
  reader.parentElement.classList.remove('reader-open');
  document.body.classList.remove('reader-open');
  reader.setAttribute('aria-hidden','true');
  requestAnimationFrame(()=>{ clampPan(); applyCamera(); sync(); updateTagOverflow(); });
  zui.focus({preventScroll:true});
}
document.getElementById('reader-close').onclick=closeReader;
vp.addEventListener('dblclick',ev=>{ if(ev.target.closest('.tile')) return; const [x,y]=rel(ev); goLevel(Z.L+1,x,y,true); });
vp.addEventListener('wheel',ev=>{ const [x,y]=rel(ev); Z.lastX=x; Z.lastY=y;
  if(ev.ctrlKey||ev.metaKey){ ev.preventDefault(); killSettle(); clearFocusPadding(); zoomToward(Math.exp(-ev.deltaY*0.0125),x,y); scheduleSnap(); return; }
  // Keep horizontal trackpad overscroll inside the calendar, including at its
  // boundaries, so Chrome cannot reinterpret it as Back or Forward navigation.
  ev.preventDefault();
  let dx=ev.deltaX, dy=ev.deltaY; if(ev.shiftKey&&!dx){ dx=dy; dy=0; } if(ev.deltaMode===1){ dx*=16; dy*=16; }
  const tx=Z.tx, ty=Z.ty; Z.tx-=dx; Z.ty-=dy; clampPan(); if(Z.tx===tx&&Z.ty===ty){ return; } killSettle(); applyCamera(); sync(); },{passive:false});
world.addEventListener('pointerover',ev=>{ const t=ev.target.closest('.tile'); if(!t) return; const p=posts[+t.dataset.i]; Z.hover=p; t.classList.add('hit'); if(Z.L<=1){ tip.hidden=false; tip.innerHTML=`<div class="m">#${pad(p.num)} · ${p.date}</div><div class="t">${esc(p.title)}</div><div class="g">${THEMES[p.th]}${p.tags.length?' · '+p.tags.join(', '):''}</div>`; } renderStatus(Object.keys(Z.el)); });
world.addEventListener('pointermove',ev=>{
  if(tip.hidden) return;
  const tw=tip.offsetWidth, th=tip.offsetHeight, gap=14, margin=8;
  // The open reader is an occluding edge just like the browser window. Prefer
  // the pointer's right side, flip left when needed, then clamp as a fallback.
  const readerLeft=reader.classList.contains('open')?reader.getBoundingClientRect().left:innerWidth;
  const rightLimit=Math.min(innerWidth,readerLeft)-margin;
  let tx=ev.clientX+gap, ty=ev.clientY+gap;
  if(tx+tw>rightLimit) tx=ev.clientX-tw-gap;
  if(ty+th>innerHeight-margin) ty=ev.clientY-th-gap;
  tx=clamp(tx,margin,Math.max(margin,rightLimit-tw));
  ty=clamp(ty,margin,Math.max(margin,innerHeight-margin-th));
  tip.style.left=tx+'px'; tip.style.top=ty+'px';
});
world.addEventListener('pointerout',ev=>{ const t=ev.target.closest('.tile'); if(!t) return; t.classList.remove('hit'); tip.hidden=true; Z.hover=null; });
zui.addEventListener('keydown',ev=>{ const k=ev.key; if(k==='+'||k==='='){ goLevel(Z.L+1); } else if(k==='-'||k==='_'){ goLevel(Z.L-1); } else if(k==='0'){ resetView(); } else if(k==='ArrowLeft'){ Z.tx+=80; } else if(k==='ArrowRight'){ Z.tx-=80; } else if(k==='ArrowUp'){ Z.ty+=80; } else if(k==='ArrowDown'){ Z.ty-=80; } else return; ev.preventDefault(); clampPan(); applyCamera(); sync(); });
mini.addEventListener('pointerdown',ev=>{ ev.stopPropagation(); const r=mini.getBoundingClientRect(); const go=e=>{ const g=laneGeom(Z.L); const wx=(e.clientX-r.left)/r.width*g.W, wy=(e.clientY-r.top)/r.height*g.H; Z.tx=Z.vw/2-wx*Z.k; Z.ty=Z.vh/2-wy*Z.k; clampPan(); applyCamera(); sync(); }; go(ev); const mv=e=>go(e); const up=()=>{ window.removeEventListener('pointermove',mv); window.removeEventListener('pointerup',up); }; window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up); });
function resetView(){ Z.L=0; Z.k=1; Z.tx=0; Z.ty=0; Z.focusMaxY=0; Z.focusMinY=null; layoutWorld(); clampPan(); applyCamera(); sync(true); updateLevelUI(); writeHash(); }

// ---------- controls ----------
const levels=document.getElementById('levels'); LV.forEach((lv,i)=>{ const b=document.createElement('button'); b.textContent=lv.name; b.setAttribute('aria-pressed',String(i===0)); b.onclick=()=>goLevel(i); levels.appendChild(b); });
const legend=document.getElementById('legend');
THEMES.forEach((t,d)=>{ const b=document.createElement('button'); b.className='chip'; b.style.setProperty('--c',COLORS[d]); b.setAttribute('aria-pressed','false'); b.innerHTML=`<i></i>${t}<span class="k">${counts[d]}</span>`; b.onclick=()=>setIso(iso===d?null:d); legend.appendChild(b); });
const tagList=document.getElementById('tag-list'), tagCounts=new Map();
posts.forEach(p=>p.tags.forEach(t=>tagCounts.set(t,(tagCounts.get(t)||0)+1)));
[...tagCounts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).forEach(([t,n])=>{
  const b=document.createElement('button'), k=document.createElement('span');
  b.className='chip tagchip'; b.setAttribute('aria-pressed','false'); b.append(document.createTextNode(t));
  k.className='k'; k.textContent=n; b.append(k); b.onclick=()=>setTag(activeTag===t?null:t); tagList.append(b);
});
const tagToggle=document.getElementById('tag-toggle');
document.getElementById('tag-total').textContent=tagCounts.size;
function updateTagOverflow(){ const p=tagList.parentElement, max=Math.max(0,tagList.scrollWidth-tagList.clientWidth); p.classList.toggle('can-scroll-left',!tagList.hidden&&tagList.scrollLeft>2); p.classList.toggle('can-scroll-right',!tagList.hidden&&tagList.scrollLeft<max-2); }
tagList.addEventListener('scroll',updateTagOverflow,{passive:true});
addEventListener('resize',updateTagOverflow);
tagToggle.onclick=()=>{ const expanded=tagToggle.getAttribute('aria-expanded')!=='true'; tagToggle.setAttribute('aria-expanded',String(expanded)); tagToggle.querySelector('.caret').textContent=expanded?'▾':'▸'; tagList.hidden=!expanded; requestAnimationFrame(updateTagOverflow); };
function applyFilters(){
  for(const i in Z.el) Z.el[i].classList.toggle('dim',isFiltered(posts[+i]));
  const matching=posts.filter(p=>!isFiltered(p)).length, parts=[];
  if(iso!=null) parts.push(`“${THEMES[iso]}”`);
  if(activeTag!=null) parts.push(`#${activeTag}`);
  document.getElementById('hint').textContent=parts.length?`${matching} posts matching ${parts.join(' + ')}`:'';
  Z.miniDirty=true; renderMini();
}
function setIso(d){ iso=d; [...legend.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(i===d))); applyFilters(); }
function setTag(t){ activeTag=t; [...tagList.children].forEach(c=>c.setAttribute('aria-pressed',String(c.firstChild?.textContent===t))); applyFilters(); }
const bi=document.getElementById('btn-index'), bd=document.getElementById('btn-date');
function setMode(m){ if(mode===m) return; const a=worldToAbs((Z.vw/2-Z.tx)/Z.k,(Z.vh/2-Z.ty)/Z.k,Z.L); const pc = posts.reduce((b,p)=>Math.abs(p.u-a.u)<Math.abs(b.u-a.u)?p:b, posts[0]);
  mode=m; bi.setAttribute('aria-pressed',String(m==='index')); bd.setAttribute('aria-pressed',String(m==='date'));
  computeUnits(); layoutWorld(); const [nx,ny]=absToWorld({u:pc.u,lane:a.lane,f:a.f},Z.L); Z.tx=Z.vw/2-nx*Z.k; Z.ty=Z.vh/2-ny*Z.k; clampPan(); Z.miniDirty=true; applyCamera(); sync(true); writeHash(); }
bi.onclick=()=>setMode('index'); bd.onclick=()=>setMode('date');
function writeHash(){ clearTimeout(Z.hashT); Z.hashT=setTimeout(()=>{ try{ const a=worldToAbs((Z.vw/2-Z.tx)/Z.k,(Z.vh/2-Z.ty)/Z.k,Z.L); history.replaceState(null,'',`#scale=${mode}&L=${Z.L}&u=${(a.u/Z.U).toFixed(4)}&lane=${a.lane}&f=${a.f.toFixed(3)}`); }catch(e){} },200); }
function readHash(){ const h=new URLSearchParams(location.hash.slice(1)); const sc=h.get('scale'); if(sc==='index'||sc==='date') mode=sc; bi.setAttribute('aria-pressed',String(mode==='index')); bd.setAttribute('aria-pressed',String(mode==='date'));
  const L=+h.get('L'); if(L>=0&&L<=TOP) Z.L=L; if(h.has('u')){ return {u:+h.get('u'),lane:+h.get('lane')||0,f:+h.get('f')||0.5}; } return null; }

// keep the browser from zooming the page itself; the chart owns pinch and ctrl-scroll
document.addEventListener('wheel',ev=>{ if(ev.ctrlKey||ev.metaKey) ev.preventDefault(); },{passive:false});
document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false}); document.addEventListener('gesturechange',ev=>ev.preventDefault(),{passive:false});
document.addEventListener('keydown',ev=>{ if((ev.ctrlKey||ev.metaKey)&&(ev.key==='+'||ev.key==='-'||ev.key==='='||ev.key==='0')) ev.preventDefault(); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&reader.classList.contains('open')){ ev.preventDefault(); closeReader(); } });
// ---------- boot ----------
const initial=readHash(); computeUnits(); layoutWorld();
if(initial){ const [nx,ny]=absToWorld({u:initial.u*Z.U,lane:clamp(initial.lane,0,K-1),f:initial.f},Z.L); Z.tx=Z.vw/2-nx; Z.ty=Z.vh/2-ny; }
clampPan(); applyCamera(); sync(true); updateLevelUI();
let rs=0; addEventListener('resize',()=>{ clearTimeout(rs); rs=setTimeout(()=>{ const a=worldToAbs((Z.vw/2-Z.tx)/Z.k,(Z.vh/2-Z.ty)/Z.k,Z.L); computeUnits(); layoutWorld(); const [nx,ny]=absToWorld({u:a.u/ (Z.U) * Z.U,lane:a.lane,f:a.f},Z.L); Z.tx=Z.vw/2-nx*Z.k; Z.ty=Z.vh/2-ny*Z.k; clampPan(); Z.miniDirty=true; applyCamera(); sync(true); },120); });
window.Z=Z; window.goLevel=goLevel; window.LV=LV; window.clampPan=clampPan; window.applyCamera=applyCamera; window.sync=sync;
</script>
